<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>University GPA & CGPA Calculator</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<div class="container">

<header>
<h1>🎓 GPA & CGPA Calculator</h1>
<button id="themeToggle">
<i class="fas fa-moon"></i>
</button>
</header>

<div class="stats">
<div class="card">
<h3>Semester GPA</h3>
<p id="gpa">0.00</p>
</div>

<div class="card">
<h3>Cumulative CGPA</h3>
<p id="cgpa">0.00</p>
</div>
</div>

<section class="course-form">

<input type="text" id="courseCode" placeholder="Course Code">

<input type="number" id="creditUnit"
placeholder="Credit Unit">

<select id="grade">
<option value="">Select Grade</option>
<option value="5">A</option>
<option value="4">B</option>
<option value="3">C</option>
<option value="2">D</option>
<option value="1">E</option>
<option value="0">F</option>
</select>

<button onclick="addCourse()">
Add Course
</button>

</section>

<section class="table-section">

<table>
<thead>
<tr>
<th>Course</th>
<th>Unit</th>
<th>Grade</th>
<th>Point</th>
<th>Action</th>
</tr>
</thead>

<tbody id="courseTable">

</tbody>
</table>

</section>

<section class="cgpa-section">

<h2>Previous Academic Record</h2>

<input type="number"
id="previousUnits"
placeholder="Total Previous Units">

<input type="number"
id="previousPoints"
placeholder="Total Previous Grade Points">

<button onclick="calculateCGPA()">
Calculate CGPA
</button>

</section>

</div>

<script src="script.js"></script>

</body>
</html>
